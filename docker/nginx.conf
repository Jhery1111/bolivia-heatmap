# Zona de cache para Vector Tiles (MVT)
proxy_cache_path /var/cache/nginx/sigmac_tiles
                 levels=1:2
                 keys_zone=sigmac_tiles:10m
                 max_size=512m
                 inactive=2m
                 use_temp_path=off;

server {
    listen 80;
    server_name _;

    # ── Frontend estático ─────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # SPA: rutas desconocidas → index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Assets con hash en el nombre → cache muy agresivo
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API REST → contenedor api:8000 ───────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # ── Vector Tiles — cache 30 s ─────────────────────────────────────────
    location ~ ^/api/v1/tiles/ {
        proxy_pass              http://api:8000;
        proxy_http_version      1.1;
        proxy_set_header        Host            $host;
        proxy_cache             sigmac_tiles;
        proxy_cache_valid       200 30s;
        proxy_cache_valid       204 5s;
        proxy_cache_use_stale   error timeout updating;
        add_header              X-Cache-Status  $upstream_cache_status;
    }

    # ── WebSocket → contenedor api:8000 ──────────────────────────────────
    location /ws/ {
        proxy_pass          http://api:8000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Health check ──────────────────────────────────────────────────────
    location /health {
        proxy_pass   http://api:8000;
        access_log   off;
    }

    # ── Swagger UI ────────────────────────────────────────────────────────
    location /docs {
        proxy_pass http://api:8000;
    }
    location /openapi.json {
        proxy_pass http://api:8000;
    }

    # Ocultar versión de Nginx
    server_tokens off;
}

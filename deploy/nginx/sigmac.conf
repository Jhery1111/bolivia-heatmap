# =============================================================================
# /etc/nginx/sites-available/sigmac
# Configuración Nginx para SIGMAC — producción
# Reemplazar ${DOMAIN} con el dominio real antes de activar
# =============================================================================

# Zona de caché para vector tiles — declarada en contexto http (incluir en nginx.conf
# o en /etc/nginx/conf.d/sigmac_cache.conf si este archivo se usa en sites-available)
proxy_cache_path /var/cache/nginx/sigmac_tiles
                 levels=1:2
                 keys_zone=sigmac_tiles:10m
                 max_size=1g
                 inactive=5m
                 use_temp_path=off;

# ── Redireccion HTTP → HTTPS ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Permitir verificación ACME (Let's Encrypt / certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Servidor principal HTTPS ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    # ── Certificados SSL (Let's Encrypt via certbot) ────────────────────────
    ssl_certificate      /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN}/chain.pem;

    # ── Parámetros SSL/TLS ───────────────────────────────────────────────────
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;
    ssl_stapling         on;
    ssl_stapling_verify  on;
    resolver             8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout     5s;

    # ── Cabeceras de seguridad ────────────────────────────────────────────────
    add_header X-Frame-Options                 "DENY"                                                                                               always;
    add_header X-Content-Type-Options          "nosniff"                                                                                            always;
    add_header X-XSS-Protection                "1; mode=block"                                                                                      always;
    add_header Referrer-Policy                 "strict-origin-when-cross-origin"                                                                    always;
    add_header Permissions-Policy              "geolocation=(self), camera=(), microphone=()"                                                       always;
    add_header Strict-Transport-Security       "max-age=31536000; includeSubDomains; preload"                                                       always;
    add_header Content-Security-Policy         "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; img-src * data: blob:; connect-src 'self' wss://${DOMAIN}; font-src 'self' data: https://unpkg.com; worker-src blob:; frame-ancestors 'none'" always;

    # ── Límites de tamaño y timeouts ─────────────────────────────────────────
    client_max_body_size 50m;
    client_body_timeout  30s;
    client_header_timeout 10s;
    keepalive_timeout    75s;
    send_timeout         30s;

    # ── Compresión gzip ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/geo+json
        application/x-protobuf
        image/svg+xml
        font/woff2;

    # ── Frontend estático (Vite build) ────────────────────────────────────────
    location / {
        root  /opt/sigmac/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Assets con hash en el nombre → cacheable 1 año
        location ~* \.(js|css|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # index.html sin caché (SPA routing)
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── API REST (proxy → uvicorn en :8000) ───────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering    off;

        # Rate limiting (requiere definir la zona en nginx.conf/http context)
        # limit_req zone=api_limit burst=20 nodelay;
    }

    # ── WebSocket (proxy → uvicorn en :8000) ──────────────────────────────────
    location /ws/ {
        proxy_pass             http://127.0.0.1:8000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
        proxy_buffering        off;
    }

    # ── Vector tiles — caché agresivo ─────────────────────────────────────────
    location ~ ^/api/v1/tiles/ {
        proxy_pass          http://127.0.0.1:8000;
        proxy_http_version  1.1;
        proxy_set_header    Host            $host;
        proxy_set_header    X-Real-IP       $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache             sigmac_tiles;
        proxy_cache_key         "$scheme$host$request_uri";
        proxy_cache_valid       200  30s;
        proxy_cache_valid       204  5s;
        proxy_cache_valid       404  10s;
        proxy_cache_bypass      $http_pragma;
        proxy_cache_revalidate  on;
        proxy_cache_lock        on;
        proxy_cache_use_stale   error timeout updating http_500 http_502 http_503 http_504;
        add_header              X-Cache-Status $upstream_cache_status;
        add_header              Cache-Control "public, max-age=30";
    }

    # ── Health check (sin log) ────────────────────────────────────────────────
    location = /health {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        access_log         off;
        proxy_read_timeout 5s;
    }

    # ── OpenAPI / Swagger (solo acceso autenticado o desde red interna) ───────
    location ~ ^/api/v1/(docs|openapi\.json|redoc)$ {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Descomentar para restringir acceso en producción:
        # allow 10.0.0.0/8;
        # deny all;
    }

    # ── Bloquear rutas sensibles ──────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|sql|sh|log|bak|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/sigmac_access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/sigmac_error.log warn;
}

version: "3.9"

services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: sigmac-postgres
    environment:
      POSTGRES_DB: sigmac_db
      POSTGRES_USER: sigmac_user
      POSTGRES_PASSWORD: sigmac_local_pass
    ports:
      - "5432:5432"
    volumes:
      - sigmac-pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d   # corre los SQL al inicio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigmac_user -d sigmac_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sigmac-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sigmac-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sigmac_user:sigmac_local_pass@postgres:5432/sigmac_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-dev-secret-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./analytics:/app/analytics
      - ./etl:/app/etl
      - ./api:/app/api

  etl:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sigmac-etl
    command: python -m etl.sync_job
    environment:
      DATABASE_URL: postgresql://sigmac_user:sigmac_local_pass@postgres:5432/sigmac_db
      REDIS_URL: redis://redis:6379/0
      SYNC_INTERVAL_SECONDS: 30
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./analytics:/app/analytics
      - ./etl:/app/etl

  frontend:
    image: node:20-alpine
    container_name: sigmac-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_BASE: ""

volumes:
  sigmac-pgdata:
